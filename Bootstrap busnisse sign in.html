<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body{
            background-color: rgb(0, 0, 0);
            color: aliceblue;
        }
    </style>
</head>
<body>
    <div class="container">
        <form action="">
            <h1>會員表單</h1>
            <hr>
            <!--第一列-->
            <div class="row">
               <div class="col-sm-12">
                    <label>請輸入帳號</label>    
                    <input type="text" placeholder="帳號" class="form-control" required> 
               </div>
        
    <div class="col-sm-6">
        <label>請選擇性別</label>
        <br>
        <input type="radio" class="form-check-input" id="radio1" name="optradio" value="男性">
        <label class="form-check-label" for="radio1">男性</label>
        <input type="radio" class="form-check-input" id="radio2" name="optradio" value="女性">
        <label class="form-check-label" for="radio2">女性</label>
    </div>
    <div class="container"> 
        <form> 
        <div class="row"> 
        <div class="col-md-8"> 
        <label for="userEmail" class="form-label">電子郵件</label> 
        <input type="email" class="form-control" id="userEmail"> 
        </div> 
        <div class="col-md-8"> 
        <label for="userPWD" class="form-label">密碼</label> 
        <input type="password" class="form-control" id="userPWD"> 
        </div> 
        <div class="col-12"> 
        <button type="submit" class="btn btn-primary">登入</button> 
        </div> 
        </div> 
        </form> 
        </div> 
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
                *{
            padding: 0px;
            margin: 0px;
            background-color: black;
        }
         header a{
            position: relative;
            text-decoration: none;
            color: rgb(255, 255, 255);
            font-size: 20px;
            font-weight: 900;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        .accttiv{
            background-color: rgba(127, 255, 212, 0.719);
        }
      header a:hover{
        color: rgb(255, 255, 255);
      }
      header li{
        display: inline;
      }
     header ul{
           position: absolute; right: 6vw; top: 0.1vw;
           letter-spacing: 0.1px;
        }
        nav a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -5px;                       
    height: 3px;
    width: 0;                           
    background-color: rgb(255, 255, 255);
    transition: 0.3s ease;              
}
nav a:hover::after {
    width: 100%; } 
    </style>
</head>
<body>
    <header>
        <nav class="nav">
            <ul>
                <li><a class="accttiv" href="#">首頁</a></li>
                <li><a href="#">關於</a></li>
                <li><a href="#">作品</a></li>
                <li><a href="#">接觸</a></li>
                <li><a href="#">報價</a></li>
            </ul>
        </nav>
    </header>
    <script> 
        //data type 資料

        "Hello" 
        true

        console.log("Hello")

        //宣告變數: let 變數名稱 
        let x; 
        x=10; 
        console.log(x); 
        let abc="你好"; 
        console.log(abc); 
        //常數 
        const z=100; 
        console.log(z); 
        z=50;//錯誤,不能變更常數中的資 
        </script>

x++; //會得到甚麼?

</script>

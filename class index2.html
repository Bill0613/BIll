<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>引導選單</title>

    <!--首頁指令-->
    <div style="width: 50%; margin: auto; text-align: center;">
        <h1 style="color: rgb(252, 244, 244);">網頁設計作品</h1>
        <hr>
    </div> <!--文字置中-->
    <div style="width: 50%; margin: auto; text-align: center;">
        <h2 style="color: rgb(252, 244, 244);">程政綜</h2> <!--名字-->

    <!--CSS--> 
    <style> 
        body {
            background-color: #000000; /* 暗色背景 */
            color: #ebd7d7; /* 白色文字 */ 
            overflow: hidden; /* 隱藏滾動條 */
        }

        .container {
            text-align: center; /* 文字置中 */
        }

        h1 {
            font-size: 3em; /* 增加標題字體大小 */
            margin-bottom: 20px; /* 標題下方間距 */
        }

        p {
            font-size: 1.5em;
        }

        ul {
            list-style-type: none; /* 移除列表項目符號 */
            padding: 0; /* 移除內邊距 */
        }

        li {
            margin: 6px 0; /* 列表項目上下間距 */
        }

        .button {
            display: inline-block; /* 使按鈕顯示為行內塊 */
            width: 200px; /* 固定按鈕寬度 */
            height: 50px; /* 固定按鈕高度 */
            padding: 10px; /* 按鈕內邊距 */
            background-color: #ff8b1e; /* 按鈕背景顏色 */
            color: #ffffff; /* 按鈕文字顏色 */
            text-decoration: none; /* 移除下劃線 */
            border-radius: 5px; /* 按鈕圓角 */
            font-size: 1.2em; /* 按鈕文字大小 */
            transition: background-color 0.3s; /* 背景顏色過渡效果 */
            line-height: 50px; /* 垂直置中 */
            text-align: center; /* 文字置中 */
            margin: 15px 0; /* 按鈕間上下間距 15px */
        }

        .button:hover {
            background-color: #2e2d2d; /* 滑鼠懸停時改變背景顏色 */
        }

        /* 框的樣式 */
        .box {
            width: 400px; 
            align-items: center;
            text-align: center;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 5px 5px 15px rgba(248, 233, 16, 0.3); 
            border: 1px solid #ddd1d1;
            display: flex;
            flex-direction: column; /* 垂直排列 */
            justify-content: center; /* 內容置中 */
            margin: 10 auto; /* 讓框置中 */
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>這是一些網頁設計的作品</h3>
        <footer>
            <p>&copy; 2025 程政綜. 版權所有。</p>
        </footer>
    </div>
    <div class="box">
        <!-- 多個按鈕放在框內 -->
        <a href="e45-4.html" class="button"target="_blank" class="button">點我 1</a>
        <a href="#" class="button"target="_blank" class="button">點我 2</a>
        <a href="#" class="button">點我 3</a>
        <a href="#" class="button">點我 4</a>
       
        
    </div>
    
</body>
</html>

</body>

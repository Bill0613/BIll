<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>  
        const jsonData = '{ "age": 18 }';
        const man= JSON.parse(jsonData);
        const output = document.getElementById("output");
        output.innerHTML += "Hello world<br>";
        if (man.age >= 20) {
            output.innerHTML += "我已經成年了。<br>";
        } else {
            output.innerHTML += "我還未成年。<br>";
        }
        output.innerHTML += "Hello world 年齡 " + man.age + "<br>";
    </script>
</body>
</html>

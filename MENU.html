<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>漢堡選單 全頁展開</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: Arial, sans-serif;
}

/* 隱藏 checkbox */
#menu-toggle {
  display: none;
}

/* 漢堡按鈕（永遠顯示） */
.menu-btn {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  width: 30px;
  height: 24px;
  position: fixed;
  top: 20px;
  right: 20px;
  cursor: pointer;
  z-index: 1001;
}
.menu-btn span {
  height: 3px;
  background-color: #333;
  border-radius: 2px;
  transition: all 0.3s ease;
}

/* 點擊變 X */
#menu-toggle:checked + .menu-btn .bar1 {
  transform: rotate(-45deg) translate(-6px, 6px);
}
#menu-toggle:checked + .menu-btn .bar2 {
  opacity: 0;
}
#menu-toggle:checked + .menu-btn .bar3 {
  transform: rotate(45deg) translate(-6px, -6px);
}

/* 預設選單隱藏 */
nav ul {
  display: none;
}

/* 展開後選單滿版 */
#menu-toggle:checked ~ nav ul {
  display: flex;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #fff;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  list-style: none;
  z-index: 1000;
}

/* 每個項目排版 */
nav ul li {
  margin: 20px 0;
  display: inline;
}

/* 超連結樣式 */
nav ul li a {
  position: relative;
  text-decoration: none;
  color: rgb(0, 0, 0);
  font-size: 28px;
  padding: 10px 20px;
  transition: color 0.3s ease;
}

/* hover 效果 */
nav ul li a:hover {
  color: rgb(0, 0, 0);
}
nav ul li a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -5px;
  height: 3px;
  width: 0;
  background-color: rgb(0, 0, 0);
  transition: 0.3s ease;
}
nav ul li a:hover::after {
  width: 100%;
}

/* 當前選單項目的背景 */
.accttiv {
  background-color: rgba(127, 255, 212, 0.493);
}

/* 可加可不加，看你要不要右上固定 */
nav ul {
  letter-spacing: 0.1px;
}

 
  

</style>
</head>
<body>

<input type="checkbox" id="menu-toggle" />
<label class="menu-btn" for="menu-toggle">
  <span class="bar1"></span>
  <span class="bar2"></span>
  <span class="bar3"></span>
</label>

<nav class="nav" id="nav-menu">

            } else {

        let grades = [70, 50, 84];

        // 假設參數 利用for迴圈
        // 會計總和和平均分數

</nav>
</body>
</html>

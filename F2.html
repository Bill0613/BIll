  <img src="pic_10889_20.jpg" width="400" height="300">
  <p><h4>赤崁樓，又作赤崁城、赤磡城、赤坎城、赤嵌城、赤嵌樓，位於臺灣臺南市中西區。其前身為荷治時期1625年1月闢建的「普羅民遮」市街，1653年於此市街赤崁行省興建之歐式城塞，1655年完工，稱「普羅民遮城」，在地人稱為「番仔樓」，曾為全台灣島的商業中心，至清代已傾圮，僅留部分殘蹟。</h4></p>
